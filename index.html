<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng Dẫn Tân Thủ Minecraft</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; padding: 15px; text-align: center; }
        h1 { color: #4CAF50; margin-bottom: 10px; font-size: 22px; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #333; }
        .btn { background: #4CAF50; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .guide { text-align: left; margin-top: 10px; line-height: 1.6; }
        code { background: #333; padding: 2px 6px; border-radius: 4px; color: #FFC107; }
    </style>
</head>
<body>
    <h1>HƯỚNG DẪN TÂN THỦ MINECRAFT</h1>
    <div class="box">
        <p>Địa chỉ IP Server:</p>
        <strong id="ip">play.myserver.net</strong>
        <button class="btn" onclick="copyIP()">Sao chép IP Server</button>
    </div>
    <div class="box guide">
        <h3 style="color:#FFC107; margin-bottom: 8px;">1. Các lệnh cơ bản</h3>
        <p>• <code>/register [mật-khẩu]</code> : Đăng ký tài khoản</p>
        <p>• <code>/login [mật-khẩu]</code> : Đăng nhập game</p>
        <p>• <code>/kit newbie</code> : Nhận quà tân thủ</p>
    </div>
    <script>
        function copyIP() {
            navigator.clipboard.writeText(document.getElementById('ip').innerText);
            alert('Đã sao chép IP thành công!');
        }
    </script>
</body>
</html>
